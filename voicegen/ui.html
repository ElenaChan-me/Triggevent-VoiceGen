<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceGen 録音スタジオ</title>
<style>
  /* XIVToolHub・Triggevent JP と同じ配色（黒・赤 / 白・水色）。OS の設定に合わせる */
  :root {
    --bg: #F5FAFD; --surface: #FFFFFF; --alt: #E6F4FB; --line: #CBE2EF;
    --fg: #1D2B36; --sub: #5B6B77; --accent: #2EA7E0; --accent-fg: #FFFFFF; --link: #1679A8;
    --rec: #D93A3A; --ok: #2E7D3E; --warn: #8A5A00; --chip-rec: #FFE8E8; --chip-ok: #E3F4E6; --chip-warn: #FFF3D6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1B1B1B; --alt: #262626; --line: #363636;
      --fg: #EDEDED; --sub: #A3A3A3; --accent: #E23B44; --accent-fg: #FFFFFF; --link: #FF6B72;
      --rec: #FF5A5A; --ok: #6CCB7F; --warn: #F2B84B; --chip-rec: #3A1C1F; --chip-ok: #1C3322; --chip-warn: #3A2C12;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.05rem; margin: 0 12px 0 0; }
  .meta { color: var(--sub); font-size: .82rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 48px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  input[type=search], select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); font: inherit; }
  input[type=search] { flex: 1 1 240px; min-width: 0; }
  label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--sub); }
  button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
  button.rec { color: var(--rec); border-color: var(--rec); font-weight: 700; }
  button.rec.on { background: var(--rec); color: #fff; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { color: var(--sub); font-variant-numeric: tabular-nums; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  .row.recording { border-color: var(--rec); }
  .text { font-size: 1.05rem; font-weight: 600; word-break: break-all; }
  .sub { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--sub); font-size: .78rem; }
  .sub code { font-family: "Consolas", monospace; }
  .chip { border-radius: 3px; padding: 0 6px; font-size: .75rem; background: var(--alt); }
  .chip.rec { background: var(--chip-rec); color: var(--rec); }
  .chip.ok { background: var(--chip-ok); color: var(--ok); }
  .chip.warn { background: var(--chip-warn); color: var(--warn); }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .level { width: 80px; height: 6px; background: var(--alt); border-radius: 3px; overflow: hidden; }
  .level > div { height: 100%; width: 0; background: var(--rec); }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; max-width: min(90vw, 640px); }
  .empty { padding: 32px; text-align: center; color: var(--sub); }
  .notice { background: var(--chip-warn); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
  @media (max-width: 640px) { .row { grid-template-columns: minmax(0, 1fr); } .actions { justify-content: flex-start; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>VoiceGen 録音スタジオ</h1>
    <span class="meta" id="meta"></span>
    <span style="flex:1"></span>
    <label class="check" for="mic">マイク <select id="mic" aria-label="マイク"><option value="">既定のマイク</option></select></label>
    <label class="check" for="auto"><input type="checkbox" id="auto" checked> 録音後に作り直す</label>
  </div>
</header>
<main>
  <div class="notice" id="rvc-off" hidden>RVC が無効です（config.toml の [rvc] enabled = false）。作り直すと、録音がそのまま仕上げられます。</div>
  <div class="filters">
    <input type="search" id="q" placeholder="セリフや ID で検索（例: 散開、L_402a）" aria-label="検索">
    <select id="kind" aria-label="種類">
      <option value="">すべての種類</option>
      <option value="line">セリフ</option><option value="segment">固定部分</option><option value="choice">選択肢</option>
      <option value="part">部品</option><option value="dot">DoT</option><option value="cd">リキャスト</option><option value="system">システム</option>
    </select>
    <select id="tag" aria-label="コンテンツ・ジョブ"><option value="">すべてのコンテンツ・ジョブ</option></select>
    <label class="check" for="only-rec"><input type="checkbox" id="only-rec"> 録音ありだけ</label>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"><div class="empty">読み込み中…</div></div>
</main>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  const KIND = { line: 'セリフ', segment: '固定部分', choice: '選択肢', part: '部品', dot: 'DoT', cd: 'リキャスト', system: 'システム' };
  const MAX_SHOWN = 200;
  let items = [], info = {}, recorder = null, recordingId = null, busy = new Set();
  const $ = id => document.getElementById(id);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(() => { t.hidden = true; }, 4000);
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  async function api(method, path, body) {
    const res = await fetch(path, { method, body });
    const data = await res.json().catch(() => ({ error: '応答を読み取れませんでした。' }));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function play(kind, id) {
    const a = new Audio(`/audio/${kind}/${encodeURIComponent(id)}.wav?t=${Date.now()}`);
    a.play().catch(() => toast('再生できませんでした。まだ音声が無い可能性があります。'));
  }

  function filtered() {
    const q = $('q').value.trim().toLowerCase(), kind = $('kind').value, tag = $('tag').value, onlyRec = $('only-rec').checked;
    return items.filter(i => (!q || i.text.toLowerCase().includes(q) || i.id.toLowerCase().includes(q))
      && (!kind || i.kind === kind) && (!tag || i.tags.includes(tag)) && (!onlyRec || i.recorded));
  }

  function rowHtml(i) {
    const isRec = recordingId === i.id, isBusy = busy.has(i.id);
    const result = !i.hasResult ? '<span class="chip">未生成</span>' : i.current ? '<span class="chip ok">仕上がり最新</span>' : '<span class="chip warn">作り直しが必要</span>';
    return `<div class="row${isRec ? ' recording' : ''}" data-id="${esc(i.id)}">
      <div style="min-width:0">
        <div class="text">${esc(i.text)}</div>
        <div class="sub"><code>${esc(i.id)}</code><span class="chip">${KIND[i.kind] || i.kind}</span>
          ${i.recorded ? '<span class="chip rec">自分の録音</span>' : '<span class="chip">VOICEVOX</span>'}${result}
          ${i.tags.slice(0, 4).map(t => `<span>${esc(t)}</span>`).join('')}${i.tags.length > 4 ? `<span>ほか${i.tags.length - 4}</span>` : ''}</div>
      </div>
      <div class="actions">
        <button data-act="play-tts" ${i.hasTts ? '' : 'disabled'} title="VOICEVOX の読み上げを聞く">▶ TTS</button>
        <button data-act="play-rec" ${i.recorded ? '' : 'disabled'} title="自分の録音を聞く">▶ 録音</button>
        <button class="rec${isRec ? ' on' : ''}" data-act="record" ${recordingId && !isRec || isBusy ? 'disabled' : ''}>${isRec ? '■ 停止' : '● 録音'}</button>
        ${isRec ? '<div class="level" aria-hidden="true"><div id="level"></div></div>' : ''}
        <button data-act="play-result" ${i.hasResult ? '' : 'disabled'} title="仕上がりを聞く">▶ 仕上がり</button>
        <button class="primary" data-act="generate" ${isBusy || isRec ? 'disabled' : ''}>${isBusy ? '作成中…' : '作り直す'}</button>
        <button data-act="delete" ${i.recorded && !isBusy && !isRec ? '' : 'disabled'} title="録音を消して VOICEVOX に戻す">録音を消す</button>
      </div></div>`;
  }

  function render() {
    const list = filtered();
    $('count').textContent = list.length > MAX_SHOWN ? `${list.length} 件中 ${MAX_SHOWN} 件を表示（検索で絞り込んでください）` : `${list.length} 件`;
    $('list').innerHTML = list.length ? list.slice(0, MAX_SHOWN).map(rowHtml).join('') : '<div class="empty">該当するセリフがありません。</div>';
  }

  function update(status) {
    const idx = items.findIndex(i => i.id === status.id);
    if (idx >= 0) items[idx] = status;
    render();
  }

  async function generate(id) {
    busy.add(id); render();
    try {
      const status = await api('POST', `/api/generate/${encodeURIComponent(id)}`);
      update(status);
      toast('作り直しました。');
      play('result', id);
    } catch (e) { toast(`作り直せませんでした: ${e.message}`); }
    finally { busy.delete(id); render(); }
  }

  async function startRecording(id) {
    let stream;
    try {
      const deviceId = $('mic').value;
      // 声をそのまま RVC に渡したいので、ブラウザの加工（エコー除去・自動音量）は切る
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    } catch (e) { toast(`マイクを使えませんでした: ${e.message}`); return; }
    await loadMics();
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recordingId = id;
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearTimeout(recorder.limit);
      const blob = new Blob(chunks, { type: recorder.mimeType });
      recorder = null; recordingId = null; render();
      try {
        update(await api('POST', `/api/recording/${encodeURIComponent(id)}`, blob));
        if ($('auto').checked) await generate(id); else toast('録音を保存しました。');
      } catch (e) { toast(`録音を保存できませんでした: ${e.message}`); }
    };
    meter(stream);
    recorder.start();
    recorder.limit = setTimeout(() => recorder && recorder.stop(), (info.maxSeconds || 15) * 1000);
    render();
  }

  function meter(stream) {
    const ctx = new AudioContext(), analyser = ctx.createAnalyser();
    ctx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    (function tick() {
      if (!recordingId) { ctx.close(); return; }
      analyser.getByteTimeDomainData(data);
      let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      const bar = $('level'); if (bar) bar.style.width = Math.min(100, peak / 128 * 140) + '%';
      requestAnimationFrame(tick);
    })();
  }

  async function loadMics() {
    try {
      const sel = $('mic'), current = sel.value;
      const mics = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput' && d.deviceId);
      sel.innerHTML = '<option value="">既定のマイク</option>' + mics.map(m => `<option value="${esc(m.deviceId)}">${esc(m.label || 'マイク')}</option>`).join('');
      sel.value = current;
      try { const saved = localStorage.getItem('voicegen-mic'); if (!current && saved) sel.value = saved; } catch (e) { /* 保存できない環境では既定のまま */ }
    } catch (e) { /* 一覧を取れなくても既定のマイクで録音できる */ }
  }

  $('list').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn || btn.disabled) return;
    const id = btn.closest('.row').dataset.id;
    const act = btn.dataset.act;
    if (act === 'play-tts') play('tts', id);
    else if (act === 'play-rec') play('recording', id);
    else if (act === 'play-result') play('result', id);
    else if (act === 'generate') generate(id);
    else if (act === 'record') { if (recordingId === id) recorder.stop(); else startRecording(id); }
    else if (act === 'delete') api('DELETE', `/api/recording/${encodeURIComponent(id)}`).then(s => { update(s); toast('録音を消しました。作り直すと VOICEVOX の声に戻ります。'); }).catch(err => toast(err.message));
  });
  ['q', 'kind', 'tag', 'only-rec'].forEach(id => $(id).addEventListener('input', render));
  $('mic').addEventListener('change', () => { try { localStorage.setItem('voicegen-mic', $('mic').value); } catch (e) { /* 無視 */ } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && recorder) recorder.stop(); });

  (async function init() {
    try {
      info = await api('GET', '/api/info');
      items = await api('GET', '/api/items');
    } catch (e) { $('list').innerHTML = `<div class="empty">読み込めませんでした: ${esc(e.message)}</div>`; return; }
    $('meta').textContent = `${info.pack} ・ ${info.count} 件 ・ ` + (info.rvcEnabled ? `RVC: ${info.model}（pitch ${info.pitch}${info.recordingPitch != null ? ` / 録音 ${info.recordingPitch}` : ''}）` : 'RVC: 無効');
    $('rvc-off').hidden = info.rvcEnabled;
    const tags = [...new Set(items.flatMap(i => i.tags))].sort();
    $('tag').innerHTML += tags.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    render();
    // マイクの一覧は許可の状態によって時間がかかるので、一覧の表示を待たせない
    loadMics();
  })();
})();
</script>
</body>
</html>
