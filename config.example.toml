# Triggevent-VoiceGen の設定。config.toml にコピーして使う（config.toml は Git に入れない）。
# パスはこのファイルからの相対パスで書ける。

[paths]
script = "data/script.json"
work = "work"
output = "output"

[select]
# 生成するコンテンツとジョブ。空の配列はすべてを意味する。
# 使える名前は data/script.json、または台本ページで確認できる（例: "M9S", "FRU", "DMU"）。
contents = ["M9S", "M10S", "M11S", "M12S"]
jobs = ["WHM", "PLD"]
parts = true          # 方角・数字・「自分」の部品
system = true         # TTS のテストなど
jobless_dots = false  # ジョブに属さない DoT（ヴァリアントダンジョンなど）

[voicevox]
url = "http://127.0.0.1:50021"
# 起動していないときに自動で起動するエンジン（不要なら空にして、自分で起動しておく）
# 例: engine = "C:/Tools/voicevox_engine/windows-cpu/run.exe"
engine = ""
speaker = 2           # スタイル ID。python -m voicegen speakers で一覧を表示できる
speed = 1.15          # 話速（0.5〜2.0）。戦闘中に聞くので少し速めにしている
pitch = 0.0           # 音高（-0.15〜0.15）
intonation = 1.0      # 抑揚（0.0〜2.0）
volume = 1.0
pre_phoneme = 0.05    # 前後の無音（秒）。仕上げで詰めるので短くてよい
post_phoneme = 0.05
sample_rate = 48000
# 文末を上げる量（0.0〜0.5）と、上げる音の数。かわいい話し方のパックで使う
end_rise = 0.0
end_moras = 2

# 合成するときだけ読みを置き換える（台本の文字は変えない）
[readings]
"DPS" = "ディーピーエス"
"MT" = "エムティー"
"ST" = "エスティー"
"LB" = "リミットブレイク"
"DoT" = "ドット"
"1番目" = "いちばんめ"
"2番目" = "にばんめ"

[rvc]
enabled = false       # モデルが決まったら true にする
# Applio をインストールしたフォルダ（例: "C:/Tools/Applio"）。日本語を含まない場所に置くと失敗しにくい
applio = ""
# Applio の Python。空なら Applio のフォルダの .venv / env / runtime から探す
python = ""
model = "models/voice.pth"
index = "models/voice.index"   # 無い場合は空文字にする
pitch = 0             # 半音単位（-24〜24）
index_rate = 0.3      # 0.0〜1.0
protect = 0.33        # 0.0〜0.5
f0_method = "rmvpe"   # rmvpe / crepe / crepe-tiny / fcpe / hybrid[rmvpe+fcpe]
volume_envelope = 1.0
embedder = "contentvec"
extra_args = []       # Applio の batch_infer にそのまま渡す追加の引数

# 自分で録音した声（python -m voicegen ui や record で取り込む）。録音があるセリフは TTS の代わりに使う
[recordings]
dir = "recordings"
# RVC の pitch を録音だけ別にする（半音）。自分の声と VOICEVOX の話者の高さが違うときに使う。消すと [rvc] と同じ
# pitch = 0
max_seconds = 15      # 1 セリフの録音の上限（秒）

[post]
ffmpeg = "ffmpeg"
sample_rate = 48000
trim_db = -50.0       # これより小さい音を無音とみなして前後を詰める
pad_ms = 20           # 詰めたあと前後に足す無音（ミリ秒）
loudness = -16.0      # 音量の目標（LUFS）
true_peak = -1.5
# 声の質感を変える ffmpeg のフィルター（; と [ ] は使えない）。例: "highshelf=f=8000:g=3"
extra_filter = ""

[pack]
name = "my-voice"
# VOICEVOX は話者ごとにクレジット表記が必要（例: "VOICEVOX:四国めたん"）。RVC モデルの作者表記もここに書く。
credit = ""

# 語尾を書き換えるスタイル。使うときはコメントを外す（例: data/styles/cute.toml）
# [style]
# file = "data/styles/cute.toml"
